name: Generate Contribution Snake

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=EC4899&color_dots=FCE7F3,FBCFE8,F9A8D4,F472B6,EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=F472B6&color_dots=1F172A,4A044E,831843,BE185D,EC4899
            dist/github-contribution-grid-snake.gif?color_snake=EC4899&color_dots=FCE7F3,FBCFE8,F9A8D4,F472B6,EC4899
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=F472B6&color_dots=1F172A,4A044E,831843,BE185D,EC4899

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
